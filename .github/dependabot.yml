version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      # Not "build(deps)": npm here is only the release tooling; a bump must not publish a release.
      prefix: "chore(deps)"
    groups:
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"
    ignore:
      # 10.x needs conventional-changelog-writer@9+, while semantic-release 25 still resolves
      # writer ^8 through its analyser plugins. The mismatch only shows when a real changelog is
      # rendered on main. Revisit together with a semantic-release that resolves writer@9.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    # eng/interop/requirements.txt: asammdf, the reference implementation of the interop check.
    # Not "build(deps)": it changes what the package is tested against, not what it contains.
    directory: "/eng/interop"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "test(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      # init and analyze have to run the same CodeQL Action version, otherwise the analyze step
      # fails ("Loaded a configuration file for version ..., but running version ..."), so a
      # separate bump of either half (#4, #6) can never pass CI on its own.
      codeql-action:
        patterns:
          - "github/codeql-action*"
